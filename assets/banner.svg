<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
  <title id="title">process631</title>
  <desc id="desc">Security-minded developer interested in security tooling, desktop apps, and web and game development</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#272463"/>
      <stop offset="1" stop-color="#5b5bd6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.55">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card">
      <rect width="1200" height="240" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#dots)"/>
    <rect width="1200" height="240" fill="url(#glow)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="92" fill="#a5b4fc" font-size="22" font-weight="500" letter-spacing="0.4">Security-minded developer</text>
    <text x="68" y="158" fill="#ffffff" font-size="72" font-weight="700" letter-spacing="-1.5">process631</text>
    <text x="72" y="198" fill="#c7d2fe" font-size="22" font-weight="400">Security tooling  ·  Desktop apps  ·  Web and game dev</text>
  </g>
</svg>
